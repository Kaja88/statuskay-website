# Rebuilds the production site on days when a scheduled blog post goes live,
# so sitemap.xml picks up the new post. (The post itself already appears on the
# blog at midnight Ljubljana time without a rebuild. See src/content/publishing.js.)
#
# Needs one repository secret: VERCEL_DEPLOY_HOOK_URL
# (Vercel → Project → Settings → Git → Deploy Hooks, branch "main").

name: Scheduled posts rebuild

on:
  schedule:
    # GitHub cron runs in UTC. 04:30 UTC = 05:30/06:30 in Ljubljana.
    - cron: "30 4 * * *"
  # Adds a "Run workflow" button on GitHub for a manual rebuild.
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for a post publishing today
        id: check
        run: |
          today=$(TZ=Europe/Ljubljana date +%F)
          if grep -q "publishAt: \"$today\"" src/content/blogPosts.js; then
            echo "Post scheduled for $today"
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing scheduled for $today"
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Vercel production deploy
        if: steps.check.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret is missing" >&2
            exit 1
          fi
          curl -fsS -X POST "$HOOK_URL"
